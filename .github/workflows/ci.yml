name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein laufender Job pro Branch reicht. Ein überholter Lauf blockiert sonst nur
# den Runner und liefert ein Ergebnis, das niemanden mehr interessiert.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ohne diesen Block bekommt jeder Job das Standard-Token mit Schreibrechten auf
# das Repository. Diese Jobs lesen nur — mehr braucht keiner von ihnen, und ein
# kompromittiertes Abhängigkeitspaket könnte mit einem Schreib-Token Commits
# erzeugen.
permissions:
  contents: read

# Alle Actions sind auf einen Commit-Hash festgelegt, nicht auf ein Tag. Ein Tag
# ist verschiebbar: wer das Repository einer Action übernimmt, kann v7 auf
# anderen Code zeigen lassen, und der läuft dann mit unserem Token. Der Hash ist
# unveränderlich. Die Version steht als Kommentar daneben, damit man beim
# Aktualisieren weiß, wo man steht.
jobs:
  verify:
    name: Lint, Typen, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonst bleibt das Token in .git/config des Runners liegen und ist für
          # jeden späteren Schritt lesbar.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    # Der Lauf dauert normal wenige Minuten. Ohne Obergrenze belegt ein
    # hängender Container den Runner bis zum GitHub-Standard von sechs Stunden.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Der Browser wird gecacht: der Download dauert länger als der gesamte
      # restliche Job. Der Schlüssel hängt an der Playwright-Version, damit ein
      # Versionssprung nicht still gegen einen veralteten Browser testet.
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Die Suite legt Konten an und schreibt in die Datenbank. Sie läuft
      # deshalb ausschließlich gegen einen frischen lokalen Stack, nie gegen
      # das echte Projekt — scripts/e2e.mjs liest die Zugangsdaten aus
      # `supabase status` und bricht ab, wenn nichts läuft. Damit kann sie gar
      # nicht versehentlich Produktionsdaten anfassen.
      #
      # Nur die Dienste, die die Tests brauchen: Postgres, GoTrue, PostgREST
      # und Kong. Studio, Realtime, imgproxy, edge-runtime und die
      # Analytics-Kette sind einige Gigabyte, die kein Test anfasst.
      - name: Supabase-Stack starten
        run: >-
          pnpm exec supabase start
          -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - run: pnpm test:e2e

      - name: Supabase-Stack stoppen
        if: always()
        run: pnpm exec supabase stop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
