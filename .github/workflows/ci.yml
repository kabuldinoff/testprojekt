name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein laufender Job pro Branch reicht. Ein überholter Lauf blockiert sonst nur
# den Runner und liefert ein Ergebnis, das niemanden mehr interessiert.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typen, Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    # Der Lauf dauert normal wenige Minuten. Ohne Obergrenze belegt ein
    # hängender Container den Runner bis zum GitHub-Standard von sechs Stunden.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Der Browser wird gecacht: der Download dauert länger als der gesamte
      # restliche Job. Der Schlüssel hängt an der Playwright-Version, damit ein
      # Versionssprung nicht still gegen einen veralteten Browser testet.
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Die Suite legt Konten an und schreibt in die Datenbank. Sie läuft
      # deshalb ausschließlich gegen einen frischen lokalen Stack, nie gegen
      # das echte Projekt — scripts/e2e.mjs liest die Zugangsdaten aus
      # `supabase status` und bricht ab, wenn nichts läuft. Damit kann sie gar
      # nicht versehentlich Produktionsdaten anfassen.
      # Nur die Dienste, die die Tests wirklich brauchen: Postgres, GoTrue,
      # PostgREST und Kong. Der volle Stack zieht zusätzlich Studio, Realtime,
      # imgproxy, edge-runtime und die Analytics-Kette (vector + logflare) —
      # zusammen einige Gigabyte, und ein erster Lauf blieb damit über zwanzig
      # Minuten hängen, ohne je fertig zu werden.
      - name: Supabase-Stack starten
        run: >-
          pnpm exec supabase start
          -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - run: pnpm test:e2e

      - name: Supabase-Stack stoppen
        if: always()
        run: pnpm supabase stop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
